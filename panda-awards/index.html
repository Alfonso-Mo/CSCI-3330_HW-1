<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="panda.css">
    <title>Panda express</title>
</head>
<body>
    <div class="top_portion">
        <h1>EARN POINTS</h1>
    </div>

    <div class="parent">

        <div class="forgot_scan">

            <h2>
                Forgot to scan?
            </h2>

            <p>
                Dont't worry, just submit the details from your receipt to claim your points.
            </p>

            <p>
                Check the sample receipt provided for guidance.
            </p>
        </div>

        <div class="box_container">
            <label class="inputTitles" for="orderNumber">Store Number</label>
            <input class="inputBox" type="text" placeholder="1619" id="orderNumber" name="orderNumber">
        </div>

        <div class="box_container">
            <label class="inputTitles" for="date">Date</label>
            <input class="inputBox" type="text" placeholder="09/05/2026" id="date" name="date">
        </div>

        <div class="box_container">
            <label class="inputTitles" for="orderNumber">Order Number</label>
            <input class="inputBox" type="text" placeholder="1619" id="orderNumber" name="orderNumber">
        </div>

        <div class="box_container">
            <label class="inputTitles" for="orderTotal">Order Total</label>
            <input class="inputBox" type="text" placeholder="$23.40" id="orderTotal" name="orderTotal">
        </div>

    </div>


</body>
</html>
